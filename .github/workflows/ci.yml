name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  engine-linux:
    name: Engine tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  tsf-windows:
    name: TSF DLL (Windows / MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release -j
      - name: Test engine
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: HodionKey-x64
          path: |
            build/platform/windows/Release/HodionKey.dll
            build/platform/windows/Release/HodionKeyConfig.exe

  tsf-mingw-cross:
    name: TSF DLL (cross-compile MinGW)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64
      - name: Configure
        run: cmake -S . -B build-win -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake -DCMAKE_BUILD_TYPE=Release
      - name: Build (DLL + app cấu hình)
        run: cmake --build build-win -j
